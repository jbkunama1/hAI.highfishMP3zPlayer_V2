name: Telegram status validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-metadata.txt
      - run: python -m unittest test_telegram_runtime test_library_telegram -v
      - run: python -m compileall -q telegram_runtime.py cover_app.py
