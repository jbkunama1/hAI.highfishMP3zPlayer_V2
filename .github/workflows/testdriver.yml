name: TestDriver E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  testdriver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: testdriverai/action@stable
      - run: npx vitest run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testdriver-artifacts
          path: test-results/
          retention-days: 7