name: Telegram admin tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-metadata.txt
      - run: python -m unittest test_telegram_admin -v
      - run: python -m compileall -q telegram_admin.py telegram_runtime.py
