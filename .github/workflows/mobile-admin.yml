name: Mobile admin validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_admin_ui -v
      - run: python -m compileall -q admin_ui.py cover_app.py
      - run: node --check player-themes.js
