name: View modes validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check view-modes.js && node test_view_modes.cjs
      - run: python -m compileall -q view_modes.py cover_app.py
